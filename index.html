<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#10060d">
<title>Na, neugierig? 😉</title>

<style>
:root {
  --bg: #080509;
  --panel: #160d16;
  --panel-border: rgba(255, 72, 157, .42);
  --pink: #ff2589;
  --pink-light: #ff72bb;
  --text: #fff8fc;
  --muted: #dfcbd8;
  /* Ganti ikon tombol di sini, misalnya: "💋", "❤️", "🔥", "😉" */
  --button-icon: "💋";
}
* { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--bg);
}
body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, Helvetica, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255, 28, 126, .16), transparent 52%),
    var(--bg);
}
main {
  display: none;
  width: 100%;
  max-width: 440px;
  margin: auto;
}
.card {
  position: relative;
  overflow: hidden;
  padding: 28px 22px 24px;
  text-align: center;
  border: 1px solid var(--panel-border);
  border-radius: 26px;
  background:
    radial-gradient(ellipse at 50% 5%, rgba(255, 38, 139, .12), transparent 42%),
    linear-gradient(160deg, #1b101b 0%, var(--panel) 58%, #120811 100%);
  box-shadow: 0 0 34px rgba(255, 24, 126, .10), inset 0 0 26px rgba(255, 70, 155, .035);
}
.card::before,
.card::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  filter: blur(48px);
  opacity: .16;
  pointer-events: none;
}
.card::before {
  top: -90px;
  left: -70px;
  background: #ff1686;
}
.card::after {
  right: -95px;
  bottom: -100px;
  background: #ff1686;
}
.lips-art {
  position: relative;
  z-index: 1;
  width: 138px;
  height: 122px;
  margin: 0 auto 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  filter: drop-shadow(0 0 8px rgba(255, 35, 137, .85));
}
.lips-art svg {
  width: 100%;
  height: 100%;
  overflow: visible;
}
h1 {
  position: relative;
  z-index: 1;
  margin: 8px 0 14px;
  font-size: clamp(27px, 7vw, 34px);
  line-height: 1.16;
  letter-spacing: -.7px;
  font-weight: 800;
  text-shadow: 0 0 18px rgba(255, 82, 166, .18);
}
.description {
  position: relative;
  z-index: 1;
  margin: 0 auto 25px;
  max-width: 340px;
  color: var(--muted);
  font-size: 17px;
  line-height: 1.65;
}


.link-button:hover {
  transform: translateY(-2px);
  filter: brightness(1.06);
  box-shadow: 0 10px 30px rgba(255, 24, 126, .38);
}
.link-button:active { transform: scale(.985); }
.tagline {
  position: relative;
  z-index: 1;
  margin: 20px 0 0;
  color: #d9bdce;
  font-size: 13px;
  line-height: 1.5;
}

.cherries-art{font-size:88px;line-height:1;height:135px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 13px rgba(255,60,155,.55))}
.button-list{position:relative;z-index:1;display:flex;flex-direction:column;gap:15px}
.link-button{min-height:68px;border:1px solid rgba(235,205,255,.65);border-radius:999px;background:linear-gradient(110deg,#a855f7 0%,#7c3aed 52%,#6d28d9 100%);box-shadow:0 0 13px rgba(168,85,247,.48),0 8px 25px rgba(124,58,237,.22),inset 0 1px 0 rgba(255,255,255,.28);color:#fff;font-size:clamp(16px,4.4vw,20px);font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 13px;animation:shakeOne 4.2s infinite;-webkit-tap-highlight-color:transparent}
.link-button:nth-child(2){animation:shakeTwo 4.2s infinite}
.link-button:nth-child(3){animation:shakeThree 4.2s infinite}
.link-button:active{filter:brightness(1.12)}
@keyframes shakeOne{0%,8%,100%{transform:translateX(0)}2%{transform:translateX(-3px) rotate(-.4deg)}4%{transform:translateX(3px) rotate(.4deg)}6%{transform:translateX(-2px)}}
@keyframes shakeTwo{0%,35%,100%{transform:translateX(0)}29%{transform:translateX(-3px) rotate(-.4deg)}31%{transform:translateX(3px) rotate(.4deg)}33%{transform:translateX(-2px)}}
@keyframes shakeThree{0%,62%,100%{transform:translateX(0)}56%{transform:translateX(-3px) rotate(-.4deg)}58%{transform:translateX(3px) rotate(.4deg)}60%{transform:translateX(-2px)}}
@media(prefers-reduced-motion:reduce){.link-button{animation:none!important}}

.hidden { display: none !important; }

/* Hide Google Translate UI if it is loaded */
.goog-te-banner-frame,
.goog-te-banner-frame.skiptranslate,
.goog-te-gadget,
.goog-te-balloon-frame,
.goog-te-menu-frame,
.goog-te-spinner-pos,
#goog-gt-tt,
.goog-tooltip,
.goog-tooltip:hover,
#google_translate_element,
body > .skiptranslate {
  display: none !important;
  visibility: hidden !important;
  height: 0 !important;
  width: 0 !important;
  overflow: hidden !important;
}
html, body { top: 0 !important; }

@media (max-width: 360px) {
  body { padding: 14px 10px; }
  .card { padding: 23px 17px 20px; border-radius: 22px; }
  .lips-art { width: 120px; height: 108px; }
  .description { font-size: 16px; }
  .link-button { min-height: 62px; font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>

<body>
<main>
  <section id="indonesia" class="hidden" aria-hidden="true"></section>

  <section id="international" class="card hidden" aria-labelledby="destination-title">
    <div class="lips-art cherries-art" role="img" aria-label="Kirsch-Emoji">🍒</div>

    <h1 id="destination-title">Na, neugierig? 😉</h1>
    <p class="description" id="destination-text">Vielleicht wartet etwas Interessantes auf dich …</p>

    <div class="button-list" aria-label="Links">
      <!-- Edit setiap nilai href di bawah dengan link tujuan masing-masing. -->
      <a class="link-button" href="https://byuxyz8.github.io/mypage/akQns7pdM8" target="_blank" rel="noopener noreferrer">💋 Komm, entdecke mein Geheimnis</a>
      <a class="link-button" href="https://usernamexyz8888-arch.github.io/8/iehdA8ndjY7" target="_blank" rel="noopener noreferrer">👅 Na, traust du dich?</a>
      <a class="link-button" href="https://geil8geil.github.io/crot/Jdja8wydhK7" target="_blank" rel="noopener noreferrer">💦 Lust auf eine Überraschung?</a>
    </div>

    <p class="tagline" id="destination-tagline">Ein Klick. Neue Möglichkeiten. ✨</p>
  </section>

  <div id="google_translate_element" class="hidden"></div>
</main>

<script>
(function () {
  "use strict";

  function show(id) {
    var main = document.querySelector("main");
    var indonesia = document.getElementById("indonesia");
    var international = document.getElementById("international");

    indonesia.classList.add("hidden");
    international.classList.add("hidden");

    if (id === "indonesia") {
      document.documentElement.style.background = "#000";
      document.body.style.background = "#000";
      main.style.display = "none";
      return;
    }

    document.documentElement.style.background = "#080509";
    document.body.style.background = "#080509";
    main.style.display = "block";
    international.classList.remove("hidden");
  }

  function setLanguage(lang) {
    var translations = {
      de: {
        title: "Na, neugierig? 😉",
        description: "Vielleicht wartet etwas Interessantes auf dich …",
        open: "Jetzt entdecken",
        tagline: "Ein Klick. Neue Möglichkeiten. ✨",
        pageTitle: "Na, neugierig? 😉"
      },
      en: {
        title: "Curious? 😉",
        description: "Something interesting might be waiting for you …",
        open: "Discover now",
        tagline: "One click. New possibilities. ✨",
        pageTitle: "Curious? 😉"
      },
      fr: {
        title: "Curieux ? 😉",
        description: "Quelque chose d’intéressant t’attend peut-être …",
        open: "Découvrir",
        tagline: "Un clic. De nouvelles possibilités. ✨",
        pageTitle: "Curieux ? 😉"
      },
      es: {
        title: "¿Tienes curiosidad? 😉",
        description: "Quizá haya algo interesante esperándote …",
        open: "Descubrir ahora",
        tagline: "Un clic. Nuevas posibilidades. ✨",
        pageTitle: "¿Tienes curiosidad? 😉"
      },
      it: {
        title: "Sei curioso? 😉",
        description: "Forse c’è qualcosa di interessante che ti aspetta …",
        open: "Scopri ora",
        tagline: "Un clic. Nuove possibilità. ✨",
        pageTitle: "Sei curioso? 😉"
      },
      nl: {
        title: "Nieuwsgierig? 😉",
        description: "Misschien wacht er iets leuks op je …",
        open: "Ontdek nu",
        tagline: "Eén klik. Nieuwe mogelijkheden. ✨",
        pageTitle: "Nieuwsgierig? 😉"
      }
    };

    var x = translations[lang] || translations.en;
    document.documentElement.lang = translations[lang] ? lang : "en";
    document.title = x.pageTitle;
    document.getElementById("destination-title").textContent = x.title;
    document.getElementById("destination-text").textContent = x.description;
    var oldLink = document.getElementById("destination-link"); if (oldLink) oldLink.textContent = x.open;
    document.getElementById("destination-tagline").textContent = x.tagline;
  }

  function translatePage() {
    if (window.google && google.translate) {
      new google.translate.TranslateElement({
        pageLanguage: "de",
        autoDisplay: false
      }, "google_translate_element");
    }
  }
  window.googleTranslateElementInit = translatePage;

  function loadGoogleTranslate(browserLang) {
    /* German is always the original/default page language. */
    setLanguage("de");

    if (!browserLang || browserLang === "de") return;

    var script = document.createElement("script");
    script.src =
      "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
    script.onerror = function () {};

    window.googleTranslateElementInit = function () {
      if (window.google && google.translate) {
        new google.translate.TranslateElement({
          pageLanguage: "de",
          autoDisplay: false,
          includedLanguages: "en,fr,es,it,nl,pt,pl,ru,tr,id"
        }, "google_translate_element");
      }
    };

    document.head.appendChild(script);

    var attempts = 0;
    var timer = setInterval(function () {
      attempts++;
      var select = document.querySelector(".goog-te-combo");

      if (select) {
        clearInterval(timer);
        select.value = browserLang;
        select.dispatchEvent(new Event("change"));
      }

      if (attempts >= 30) clearInterval(timer);
    }, 500);
  }

  fetch("https://ipapi.co/json/", { cache: "no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("Location lookup failed");
      return response.json();
    })
    .then(function (data) {
      if (!data || !data.country_code) throw new Error("Country unavailable");

      /* Existing behavior retained: visitors detected in Indonesia see no LP. */
      if (data.country_code === "ID") {
        show("indonesia");
        return;
      }

      var browserLang =
        (navigator.languages && navigator.languages[0]) ||
        navigator.language ||
        "en";
      browserLang = browserLang.split("-")[0].toLowerCase();

      setLanguage("de");
      show("international");
      loadGoogleTranslate(browserLang);
    })
    .catch(function () {
      setLanguage("en");
      show("international");
    });
})();
</script>
</body>
  </html>
